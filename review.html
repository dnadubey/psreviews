<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Leave a Review</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #4f46e5, #3b82f6);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
    }

    h1 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 24px;
      color: #111827;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 20px;
      font-size: 14px;
    }

    label {
      font-weight: 600;
      font-size: 14px;
      margin-top: 14px;
      display: block;
      color: #374151;
    }

    input,
    textarea {
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: #4f46e5;
    }

    textarea {
      resize: none;
      min-height: 80px;
    }

    /* ⭐ STAR RATING */
    .stars {
      display: flex;
      gap: 8px;
      font-size: 28px;
      cursor: pointer;
      margin-top: 8px;
    }

    .star {
      color: #d1d5db;
      transition: color 0.2s;
    }

    .star.active {
      color: #facc15;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    .footer {
      margin-top: 14px;
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Leave a Review</h1>
    <p class="subtitle">Your feedback helps this business grow</p>

    <form action="/submit-review" method="POST">
      <!-- hidden fields -->
      <input type="hidden" name="companyId" id="companyId" />
      <input type="hidden" name="rating" id="rating" />

      <label>Your Name</label>
      <input type="text" name="name" placeholder="Enter your name" required />

      <label>Mobile Number</label>
      <input type="tel" name="mobile" placeholder="10 digit mobile number" required />

      <label>Email</label>
      <input type="email" name="email" placeholder="example@email.com" required />

      <label>Rating</label>
      <div class="stars">
        <span class="star" data-value="1">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="5">★</span>
      </div>

      <label>Comment</label>
      <textarea name="comment" placeholder="Write your experience..." required></textarea>

      <button type="submit">Submit Review</button>
    </form>

    <div class="footer">Thank you for your valuable feedback ❤️</div>
  </div>

  <script>
    // Get companyId from URL (/review/:id)
    const companyId = window.location.pathname.split("/").pop();
    document.getElementById("companyId").value = companyId;

    // Star rating logic
    const stars = document.querySelectorAll(".star");
    const ratingInput = document.getElementById("rating");

    stars.forEach((star, index) => {
      star.addEventListener("click", () => {
        ratingInput.value = index + 1;

        stars.forEach((s, i) => {
          s.classList.toggle("active", i <= index);
        });
      });
    });
  </script>
</body>
</html>
